<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Knoten – Longboard-Karte</title><meta name="theme-color" content="#1d1f1a">
<style>
:root{--bg:#f6f6f2;--card:#fff;--tx:#1d1f1a;--mu:#666;--bd:#ddd;--ac:#ff9a3c}
html.dark{--bg:#121416;--card:#1c1f22;--tx:#eceee8;--mu:#9aa0a6;--bd:#33373b}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;position:sticky;top:0;background:var(--bg);z-index:2}
header a{color:var(--tx);text-decoration:none;font-size:22px;padding:2px 8px}header h1{font-size:19px;margin:0}
.wrap{max-width:560px;margin:0 auto;padding:0 12px 24px}
.list{display:grid;gap:10px}.kn{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer}
.kn svg{width:64px;height:72px;flex:none}.kn b{font-size:17px}.kn .mu{color:var(--mu);font-size:14px}.kn.dis{opacity:.5;cursor:default}
.ok{color:#2e9e5b;font-size:13px;font-weight:600}
.view{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.pic{background:#fbf8ef;border-radius:10px;display:flex;justify-content:center}html.dark .pic{background:#e9e4d6}
.pic svg{width:100%;max-width:340px;height:auto;max-height:52vh}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0 4px}.dots span{width:9px;height:9px;border-radius:50%;background:var(--bd)}.dots span.on{background:var(--ac)}
.st{font-size:17px;min-height:4.4em;margin:6px 2px}.st small{display:block;color:var(--mu);font-size:14px;margin-top:4px}
.nav{display:flex;gap:10px}.nav button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
.nav button.p{background:var(--ac);border-color:var(--ac);color:#1d1f1a;font-weight:600}.nav button:disabled{opacity:.4}
.info{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-top:12px}.info h3{margin:0 0 6px;font-size:15px}.info p{margin:4px 0}
.leg{display:flex;gap:14px;flex-wrap:wrap;color:var(--mu);font-size:13px;margin-top:8px}.leg i{display:inline-block;width:18px;height:7px;border-radius:4px;vertical-align:middle;margin-right:4px;border:1.5px solid #2a2522}

.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:3px;margin-bottom:10px}.seg button{flex:1;border:0;background:none;color:var(--tx);padding:9px;border-radius:9px;font-size:15px}.seg button.on{background:var(--ac);color:#1d1f1a;font-weight:600}
label.chk{display:flex;gap:8px;align-items:center;margin-top:10px}
</style></head><body>

// Seil-Zeichner: ein oder mehrere Seile (Punktliste + z-Ebene je Segment), Über/Unter an Kreuzungen
function ropeSVG(K,step,opt){opt=opt||{};const ST=opt.steps||K.steps,S=ST[step];
 if(S.fig)return ropeSVG(S.fig,S.fig.steps.length-1,{});
 const ropes=K.ropes||[{pts:K.pts,z:K.z}];const W0=K.w||13,F0=K.f||9;
 const up=(st,ri)=>st?(Array.isArray(st.upto)?st.upto[ri]:st.upto):0;
 let el=[];const props=K.props||[];
 const lv=new Set(props.map(p=>p.z));ropes.forEach((r,ri)=>r.z.slice(0,up(S,ri)).forEach(v=>lv.add(v)));
 const levels=[...lv].sort((a,b)=>a-b);
 const segOf=(P,upto,i)=>{const cr=j=>P[Math.max(0,Math.min(upto,j))];const p0=cr(i-1),p1=P[i],p2=P[i+1],p3=cr(i+2),t=0.5/3;
  return [p1,[p1[0]+(p2[0]-p0[0])*t,p1[1]+(p2[1]-p0[1])*t],[p2[0]-(p3[0]-p1[0])*t,p2[1]-(p3[1]-p1[1])*t],p2]};
 const dS=s=>' C'+s[1].map(v=>v.toFixed(1)).join(',')+' '+s[2].map(v=>v.toFixed(1)).join(',')+' '+s[3].join(',');
 for(const L of levels){
  for(const pr of props)if(pr.z===L)el.push(pr.svg);
  ropes.forEach((R,ri)=>{const P=R.pts,Z=R.z,upto=up(S,ri),from=step>0?up(ST[step-1],ri):0;const W=R.w||W0,F=R.f||F0;const base=R.col||'#e6c88a',hi=R.hi||'#ff9a3c';
   const ids=[];for(let i=0;i<upto;i++)if(Z[i]===L)ids.push(i);const runs=[];let cur=null;for(const i of ids){if(cur&&i===cur[1]+1)cur[1]=i;else{cur=[i,i];runs.push(cur)}}
   for(const [a,b] of runs){let d='M'+P[a].join(',');for(let i=a;i<=b;i++)d+=dS(segOf(P,upto,i));
    el.push('<path d="'+d+'" fill="none" stroke="#2a2522" stroke-width="'+W+'" stroke-linecap="butt"/>');
    if(a===0&&!R.noStartCap)el.push('<circle cx="'+P[0][0]+'" cy="'+P[0][1]+'" r="'+W/2+'" fill="#2a2522"/>');
    if(b===upto-1)el.push('<circle cx="'+P[upto][0]+'" cy="'+P[upto][1]+'" r="'+W/2+'" fill="#2a2522"/>');
    for(let i=a;i<=b;i++){const s=segOf(P,upto,i);const mk=S.mark&&(Array.isArray(S.mark[0])?(S.mark[ri]||[]).includes(i):ri===0&&S.mark.includes(i));const nw=!S.nonew&&step>0&&i>=from;
     el.push('<path d="M'+s[0].join(',')+dS(s)+'" fill="none" stroke="'+(mk?'#5aa0ff':nw?hi:base)+'" stroke-width="'+F+'" stroke-linecap="round"/>')}
    if(a===0&&!R.noStartCap)el.push('<circle cx="'+P[0][0]+'" cy="'+P[0][1]+'" r="'+F/2+'" fill="'+base+'"/>');
    if(b===upto-1){const nw=!S.nonew&&step>0&&b>=from;el.push('<circle cx="'+P[upto][0]+'" cy="'+P[upto][1]+'" r="'+F/2+'" fill="'+(nw?hi:base)+'"/>')}}
  });
 }
 ropes.forEach((R,ri)=>{if(R.noEndDot)return;const e=R.pts[up(S,ri)];if(up(S,ri)>0)el.push('<circle cx="'+e[0]+'" cy="'+e[1]+'" r="'+Math.max(2,(R.f||F0)/3)+'" fill="#2a2522"/>')});
 for(const ar of (S.arrows||(S.arrow?[S.arrow]:[]))){const [a,b]=ar;el.push('<path d="M'+a.join(',')+' L'+b.join(',')+'" stroke="#3a86ff" stroke-width="3" marker-end="url(#ah)" fill="none"/>')}
 if(S.label)for(const t of S.label)el.push('<text x="'+t[0]+'" y="'+t[1]+'" font-size="'+(t[3]||13)+'" font-family="system-ui,sans-serif" fill="#3a3530" text-anchor="middle">'+t[2]+'</text>');
 return '<svg viewBox="'+(K.vb||'0 0 300 300')+'" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a86ff"/></marker></defs>'+(K.bg||'')+el.join('')+'</svg>'}

const KNOTS=[
 {id:'palstek',K:PALSTEK,name:'Palstek',kurz:'Feste Schlaufe, zieht sich nicht zu, geht nach Last wieder auf',
  wofuer:'Seil um einen Ast oder Baum legen, Board oder Müllbeutel daran hängen. Schlaufe am Seilende fürs Tragen über der Schulter.',
  merk:'„Der Hase kommt aus dem Loch, läuft um den Baum und springt zurück ins Loch.“ Loch = kleines Auge, Baum = stehender Teil, Hase = Seilende.',
  texte:[
   ['Kleines Auge legen.','Im Seil, mit genug Rest für die große Schlaufe. Wichtig: Der Teil Richtung Ende liegt <b>oben</b> auf dem stehenden Teil.'],
   ['Um den Ast, dann von hinten durchs Auge hoch.','Das Ende geht um den Ast (große Schlaufe) und kommt <b>von unten/hinten</b> durch das kleine Auge.'],
   ['Hinter dem stehenden Teil herum.','Der Hase läuft um den Baum: Ende <b>hinter</b> dem stehenden Teil auf die andere Seite.'],
   ['Vorne zurück ins Auge.','Ende <b>vorne</b> über den stehenden Teil und wieder runter durchs kleine Auge, direkt neben sich selbst.'],
   ['Festziehen.','Ende und Schlaufen-Bein zusammen fassen und gegen den stehenden Teil ziehen. Ende etwa eine Handbreit lang lassen.']],
  loesen:[
   ['Kragen nach vorn umklappen.','Der <b>blaue</b> Bogen um den stehenden Teil ist der Kragen. Mit dem Daumen kräftig nach vorn und unten drücken („den Rücken brechen“). Das lockert den ganzen Knoten, auch wenn vorher Last drauf war.'],
   ['Ende zurück hinter dem stehenden Teil raus.','Jetzt ist alles locker: Das Ende den Weg zurück, hinter dem stehenden Teil hervor.'],
   ['Ende unten aus dem Auge ziehen.','Das Ende nach unten wieder aus dem kleinen Auge ziehen.'],
   ['Offen.','Das kleine Auge fällt von selbst auseinander.']]},
 {id:'mastwurf',K:MASTWURF,name:'Mastwurf mit Slip',kurz:'Schnell um Stamm, Ast oder Pfosten – geht mit einem Zug wieder auf',
  wofuer:'Board oder Sachen an Baum, Ast oder Pfosten hängen. Mit Slip morgens mit einem Zug offen.<br><span style="color:var(--mu)">Hält am besten bei Zug quer zum Stamm. Bei Zug entlang des Stamms oder ständig wechselnder Last kann er wandern – für Schweres den Rundtörn mit zwei halben Schlägen nehmen.</span>',
  merk:'„Zwei Runden in dieselbe Richtung, die zweite kreuzt die erste – und das Ende unters Kreuz.“',
  texte:[
   ['Einmal um den Stamm.','Seil vorne über den Stamm, hinten herum und unterhalb der ersten Lage wieder nach vorn.'],
   ['Zweite Runde schräg über die erste.','Vorne <b>schräg nach oben über</b> die erste Runde – das ist das Kreuz – und wieder hinten herum.'],
   ['Schlaufe unter das Kreuz.','Nicht das Ende durchziehen, sondern eine <b>Schlaufe</b> zwischen Schräge und Stamm durchstecken. Das freie Ende bleibt draußen: das ist der Slip.'],
   ['Festziehen.','Stehenden Teil und Schlaufe gegeneinander ziehen, bis das Kreuz fest auf dem Stamm sitzt.']],
  loesen:[
   ['Am freien Ende ziehen.','Am <b>blauen</b> freien Ende ziehen – die Schlaufe rutscht unter dem Kreuz durch. Geht auch, wenn Last dran ist.'],
   ['Runden abwickeln.','Die beiden Runden liegen jetzt nur noch lose um den Stamm und lassen sich abnehmen.']]},
 {id:'rundtoern',K:RUNDTOERN,name:'Rundtörn mit zwei halben Schlägen',kurz:'Hält schwere Last am Ast, lässt sich unter Last binden und lösen',
  wofuer:'Schwere Sachen an einen Ast, Board aufhängen, und als Teil vom Behelf am Baum. Der große Vorteil: Die zwei Runden halten die Last schon allein über Reibung – du kannst in Ruhe die Schläge machen, und beim Lösen genauso.',
  merk:'„Zweimal rum, zweimal Schlag – die Runden tragen, die Schläge sichern.“ Beide Schläge in <b>dieselbe</b> Richtung.',
  texte:[
   ['Einmal um den Ast.','Seil über den Ast und einmal ganz herum.'],
   ['Noch einmal herum: Rundtörn.','Eine zweite volle Runde direkt daneben. Ab jetzt hält die Reibung die Last – du kannst den stehenden Teil loslassen.'],
   ['Erster halber Schlag.','Ende <b>hinter</b> dem stehenden Teil durch, außen herum, <b>vorne</b> zurück – und dann von unten <b>unter dem eigenen Seil</b> durch. Das Ende zeigt danach wieder zum Ast.'],
   ['Zweiter halber Schlag.','Genau gleich und in <b>dieselbe</b> Richtung: hinter dem stehenden Teil durch, vorne zurück, unter dem eigenen Seil durch. Zusammen sind die beiden Schläge ein Mastwurf um den stehenden Teil.'],
   ['Festziehen.','Beide Schläge zusammenziehen und am stehenden Teil hoch zum Ast schieben.']],
  loesen:[
   ['Oberen Schlag aufmachen.','Den <b>blauen</b> Schlag (der zuletzt gemachte) aufziehen. Das geht auch, wenn Last dran ist – die Runden halten.'],
   ['Unteren Schlag aufmachen.','Genauso den ersten Schlag lösen.'],
   ['Runden abwickeln.','Last mit der Hand halten und die zwei Runden vom Ast abwickeln.']]},
 {id:'spannstek',name:'Spannstek',kurz:'Verstellbare Schlaufe zum Abspannen von Zelt oder Plane',soon:true},
 {id:'fuhrmann',name:'Fuhrmannsknoten',kurz:'Richtig stramm festzurren: Board an Rucksack, Kiste',soon:true},
 {id:'zimmermann',name:'Zimmermannsstek',kurz:'Um Unförmiges: Board hinterherziehen, Kiste an Stein',soon:true},
 {id:'schotstek',name:'Schotstek',kurz:'Seil an Seil, auch verschieden dicke',soon:true},
 {id:'takling',K:TAKLING,group:'Seilenden sichern',name:'Takling',kurz:'Ende umwickeln – baut praktisch nicht auf, passt durch Ösen',
  wofuer:'Gegen das Aufdrehen der Seilenden. Als Schnur reicht (gewachste) Zahnseide oder dünnes Garn. Bei Baumwolle geht kein Abschmelzen – ein Tropfen Sekundenkleber auf die fertige Wicklung hält zusätzlich.',
  merk:'„Schlaufe zum Ende, wickeln zur Schlaufe, Ende rein, hinten ziehen.“',
  texte:[
   ['Schlaufe längs anlegen.','Ausgefranstes Ende abschneiden. Schnur zu einer langen Schlaufe legen und längs aufs Seil legen: die <b>Schlaufe zeigt zum Seilende</b>, das kurze Schnurende schaut hinten raus.'],
   ['Straff wickeln.','Etwa 1,5 Seildurchmesser vor dem Ende anfangen und <b>straff, dicht an dicht</b> Richtung Seilende wickeln – über beide Schenkel der Schlaufe. Länge der Wicklung: 1 bis 1,5 Seildurchmesser.'],
   ['Ende durch die Schlaufe.','Das Wickelende durch die Schlaufe stecken, die vorne noch rausschaut.'],
   ['Hinten am kurzen Ende ziehen.','Die Schlaufe zieht das Wickelende <b>unter die Windungen</b>, bis etwa zur Mitte. Nicht ganz durchziehen.'],
   ['Abschneiden.','Beide Schnurenden bündig abschneiden. Fertig – kaum dicker als das Seil.']]},
{id:'matthewwalker',href:'matthewwalker.html',img:'mw_thumb.png',group:'Seilenden sichern',name:'Matthew Walker',kurz:'Kleiner Knoten aus den eigenen Kardeelen – ohne Zusatzmaterial, 3D zum Drehen'}];
const DONE=(()=>{try{return JSON.parse(localStorage.getItem('lbk_knoten')||'{}')}catch(e){return {}}})();
function save(){try{localStorage.setItem('lbk_knoten',JSON.stringify(DONE))}catch(e){}}
const app=document.getElementById('app');
function list(){document.getElementById('ttl').textContent='Knoten';
 let G0='';app.innerHTML='<p style="color:var(--mu);margin:4px 2px 12px">Schritt für Schritt, auch ohne Netz. Orange ist der Schritt, der gerade dazukommt.</p><div class="list">'+KNOTS.map(k=>((k.group||'')!==G0?(G0=k.group||'','<h3 style="margin:14px 2px 2px;font-size:15px;color:var(--mu)">'+G0+'</h3>'):'')+'<div class="kn'+(k.soon?' dis':'')+'" data-id="'+k.id+'">'+(k.img?'<img src="'+k.img+'" alt="" style="width:64px;height:72px;flex:none;border-radius:8px">':k.K?ropeSVG(k.K,k.K.steps.length-1,{}).replace('<svg','<svg preserveAspectRatio="xMidYMid meet"'):'<svg viewBox="0 0 64 72"></svg>')+'<div><b>'+k.name+'</b> '+(DONE[k.id]?'<span class="ok">✓ kann ich</span>':'')+'<div class="mu">'+k.kurz+(k.soon?' · kommt bald':'')+'</div></div></div>').join('')+'</div>';
 app.querySelectorAll('.kn').forEach(d=>d.onclick=()=>{const k=KNOTS.find(x=>x.id===d.dataset.id);if(k.href)location.href=k.href;else if(!k.soon)location.hash=k.id})}
let MODE='binden';
function show(k,s){document.getElementById('ttl').textContent=k.name;const K=k.K,lo=MODE==='loesen'&&K.loesen,ST=lo?K.loesen:K.steps,TX=lo?k.loesen:k.texte,n=ST.length;s=Math.max(0,Math.min(n-1,s));
 app.innerHTML=(K.loesen?'<div class="seg"><button data-m="binden" class="'+(lo?'':'on')+'">Binden</button><button data-m="loesen" class="'+(lo?'on':'')+'">Lösen</button></div>':'')+'<div class="view"><div class="pic">'+ropeSVG(K,s,{steps:ST})+'</div><div class="dots">'+ST.map((x,i)=>'<span class="'+(i===s?'on':'')+'"></span>').join('')+'</div>'
  +'<div class="st"><b>'+(s+1)+'. '+TX[s][0]+'</b><br>'+TX[s][1]+'</div><div class="nav"><button id="bz"'+(s?'':' disabled')+'>‹ Zurück</button><button class="p" id="bw">'+(s<n-1?'Weiter ›':'Nochmal')+'</button></div>'
  +'<div class="leg">'+(lo?'<span><i style="background:#5aa0ff"></i>hier anfassen</span>':'<span><i style="background:#ff9a3c"></i>neu in diesem Schritt</span>')+'<span>● Seilende</span><span>Wo ein Seil unterbricht, läuft es <b>darunter</b>.</span></div></div>'
  +'<div class="info"><h3>Merksatz</h3><p>'+k.merk+'</p><h3 style="margin-top:10px">Wofür</h3><p>'+k.wofuer+'</p><label class="chk"><input type="checkbox" id="kc"'+(DONE[k.id]?' checked':'')+'> Kann ich auswendig</label></div>';
 app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{MODE=b.dataset.m;show(k,0)});document.getElementById('bz').onclick=()=>show(k,s-1);document.getElementById('bw').onclick=()=>show(k,s<n-1?s+1:0);
 document.getElementById('kc').onchange=e=>{DONE[k.id]=e.target.checked;save()};
 let x0=null;const pic=app.querySelector('.pic');pic.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});pic.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)show(k,dx<0?s+1:s-1);x0=null})}
function route(){MODE='binden';const id=location.hash.slice(1);const k=KNOTS.find(x=>x.id===id&&!x.soon);if(k)show(k,0);else list();scrollTo(0,0)}
addEventListener('hashchange',route);route();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
